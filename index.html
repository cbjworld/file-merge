<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일 수합기</title>
<meta name="description" content="엑셀·한글 파일을 여러 개 넣으면 하나로 합쳐줍니다.">
<style>

:root{--ink:#242424;--sub:#61666d;--red:#b42318;--font:"Segoe UI","Malgun Gothic",sans-serif;color-scheme:light}
body{--accent:#107c41;--hover:#0c6334;--soft:#e7f4ec;--tint:#f6faf7;--line:#dce8e0;--border:#9bc5ab;--glow:#107c411a;--bright:#64bd8a;--blue:var(--accent);--green:var(--accent);--bg:#f2f7f4}
body[data-theme=hwpx]{--accent:#0f6cbd;--hover:#115a9b;--soft:#e7f1fc;--tint:#f5f9fe;--line:#dce5f0;--border:#9cbfe3;--glow:#0f6cbd1a;--bright:#70b2ee;--bg:#f2f6fc}
*{box-sizing:border-box}
body{margin:0;padding:0 24px 40px;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);transition:background .25s}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}a{color:inherit}main{max-width:1080px;margin:auto}
.nav{display:flex;align-items:center;gap:24px;min-height:88px;padding:20px 0}.brand{font-size:22px;font-weight:700;letter-spacing:-.7px;flex-shrink:0;white-space:nowrap}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:white;font-style:normal;margin-right:10px;box-shadow:0 3px 9px var(--glow);transition:background .25s}.lead{color:var(--sub);margin:0;font-size:14px;word-break:keep-all}
.workspace{display:grid;grid-template-columns:230px 1fr;gap:32px;background:#ffffffed;border:1px solid #ffffff;border-radius:16px;padding:32px;box-shadow:0 2px 5px #172b4d05,0 12px 36px #172b4d0a}
.side{border-right:1px solid var(--line);padding-right:28px}.side h2{font-size:22px;letter-spacing:-.6px;margin:2px 0 12px}.side p{font-size:13px;color:var(--sub);margin:0 0 24px}.step{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:12px;color:var(--sub)}.step b{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--accent);font-size:10px}.local{font-size:11px;color:var(--sub);margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.seg{display:flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--tint);margin-bottom:20px}.seg button{flex:1;position:relative;border:0;background:none;color:var(--sub);padding:11px;border-radius:6px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}.seg button:hover{background:var(--soft)}.seg button[aria-selected=true]{background:white;box-shadow:0 1px 4px #00000012;color:var(--accent);font-weight:700}.seg button[aria-selected=true]:after{content:'';position:absolute;bottom:0;left:calc(50% - 12px);height:3px;width:24px;background:var(--accent);border-radius:3px}
.card{animation:appear .25s ease both}.hint{color:var(--sub);font-size:12px;margin:0 0 18px;line-height:1.8}.drop{position:relative;overflow:hidden;border:1.5px dashed var(--border);border-radius:12px;padding:28px 12px;text-align:center;background:var(--tint);transition:background .25s,border-color .25s,transform .25s}.drop-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--soft);margin:0 auto 12px;color:var(--accent);font-size:25px;transition:transform .25s,background .25s,color .25s}.drop.drag{background:var(--soft);border-color:var(--accent);transform:scale(1.01)}.drop.drag .drop-icon{transform:translateY(-5px)}.drop p{font-size:13px;margin:0 0 14px;color:var(--sub)}
button.b{border:1px solid transparent;border-radius:7px;padding:10px 20px;cursor:pointer;background:var(--accent);color:white;font-weight:600;transition:transform .2s,box-shadow .2s,background .25s}button.b:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px var(--glow);background:var(--hover)}button.b:active:not(:disabled){transform:scale(.98)}button.b:disabled{background:var(--soft);color:var(--accent);opacity:.65;cursor:default}button.b.plain{background:white;color:var(--accent);border:1px solid var(--line);font-size:12px;padding:8px 20px;box-shadow:0 1px 2px #00000006}button.b.plain:hover:not(:disabled){background:var(--soft)}button.t{background:none;border:0;color:var(--accent);cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
ol{list-style:none;margin:14px 0 0;padding:0}ol li{display:flex;align-items:center;gap:8px;padding:10px;background:var(--tint);border:1px solid var(--line);border-radius:8px;margin:7px 0;min-width:0;animation:appear .3s ease both;animation-delay:calc(var(--i,0)*35ms)}ol li.over{background:var(--soft);border-color:var(--accent)}.n{color:var(--accent);font-size:11px;width:19px;text-align:center}.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.base{font-size:10px;color:var(--accent);background:var(--soft);border-radius:4px;padding:2px 6px;white-space:nowrap}.sz{color:var(--sub);font-size:10px;white-space:nowrap}.ic{border:0;background:none;color:var(--sub);font-size:14px;min-width:27px;height:28px;border-radius:5px;cursor:pointer}.ic:hover:not(:disabled){background:var(--soft)}.ic:disabled{opacity:.25;cursor:default}.empty{color:var(--sub);text-align:center;font-size:11px;margin:14px 0}
.run{margin-top:20px;display:flex;flex-direction:column;gap:9px;align-items:center}.run>.b{width:100%;padding:13px;font-size:14px;position:relative;overflow:hidden}.bar{width:100%;height:4px;border-radius:5px;background:var(--soft);overflow:hidden;visibility:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--bright));transition:width .3s;border-radius:5px}.bar.on{visibility:visible}.st{font-size:12px;color:var(--sub);min-height:20px;text-align:center}.err{color:var(--red)}.ok{color:var(--accent)}
.res{position:relative;margin-top:14px;padding:24px 16px;border:1px solid var(--border);background:var(--tint);border-radius:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:reveal .45s ease both}.success-icon{display:grid;place-items:center;border-radius:50%;width:44px;height:44px;background:var(--accent);color:white;font-size:23px;animation:reveal .6s cubic-bezier(.2,1.6,.4,1)}.res h3{font-size:19px;letter-spacing:-.5px;margin:0}.res p{font-size:12px;color:var(--sub);margin:0}.warn{text-align:left;font-size:11px;color:#74663c;margin:0;padding-left:18px;width:100%;overflow-wrap:anywhere}
details{margin-top:13px;color:var(--sub);font-size:11px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow:auto;max-height:200px;border-radius:6px;padding:12px;background:var(--tint);font:11px/1.7 monospace}.busy .drop{opacity:.55}.busy .run>.b:after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,#ffffff22 50%,transparent 75%);animation:shine 1.7s infinite}.busy .drop-icon{animation:pulse 1.5s infinite}.confetti{position:fixed;z-index:20;top:-18px;pointer-events:none;width:7px;height:11px;background:var(--c);animation:fall var(--d) ease-in forwards;border-radius:2px}
footer{margin-top:22px;color:var(--sub);font-size:11px}.count{font-size:11px;color:var(--accent);margin-top:14px}[hidden]{display:none!important}
@keyframes appear{from{opacity:0;translate:0 7px}to{opacity:1;translate:0 0}}@keyframes reveal{from{opacity:0;scale:.94;translate:0 10px}to{opacity:1;scale:1;translate:0 0}}@keyframes shine{from{translate:-100% 0}to{translate:100% 0}}@keyframes pulse{50%{scale:.94;opacity:.6}}@keyframes fall{to{translate:var(--x) 105vh;rotate:var(--r);opacity:0}}
@media(max-width:740px){body{padding:0 18px 28px}.nav{min-height:82px;gap:14px;padding:18px 0}.lead{font-size:12px;line-height:1.6}.workspace{grid-template-columns:1fr;padding:20px;gap:18px}.side{padding:0;border:0}.side h2{font-size:21px;margin:0}.side p,.steps,.local,.base,.sz{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.confetti{display:none}}

</style>
</head>
<body>
<main>
  <nav class="nav" aria-label="사이트 안내"><div class="brand"><i aria-hidden="true">≋</i>수합기</div><p class="lead">엑셀·한글 파일을 여러 개 넣으면 하나로 합쳐줍니다.</p></nav>
  <div class="workspace"><aside class="side"><h2>수합을 시작하세요.</h2><p>파일은 여기에.<br>나머지는 수합기가 할게요.</p><div class="steps"><div class="step"><b>01</b>파일 형식 선택</div><div class="step"><b>02</b>파일 추가 · 순서 정리</div><div class="step"><b>03</b>합치고 다운로드</div></div><div class="local">◈ 문서내용은 외부로 유출되지 않습니다</div></aside><div><div class="seg" role="tablist" aria-label="파일 형식"><button role="tab" id="tab-excel" aria-selected="true" aria-controls="panel-excel">엑셀 XLSX</button><button role="tab" id="tab-hwpx" aria-selected="false" aria-controls="panel-hwpx">한글 HWPX</button></div><div id="panels"></div></div></div>
  <footer><span>문서내용은 외부로 유출되지 않습니다</span></footer>
</main>

<template id="tpl">
  <section class="card" role="tabpanel">
    <p class="hint"></p>
    <div class="drop"><div class="drop-icon" aria-hidden="true">↥</div><p></p><button class="b plain" data-a="pick">파일 선택</button><input type="file" multiple hidden></div>
    <div class="count" hidden></div><ol aria-label="수합할 파일 목록"></ol>
    <p class="empty">파일을 2개 이상 추가하세요.</p>
    <div class="run">
      <button class="b" data-a="run" disabled></button>
      <div class="bar" role="progressbar" aria-label="파일 수합 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      <div class="st" role="status" aria-live="polite"></div>
    </div>
    <div class="res" hidden></div>
    <details><summary>진행 로그</summary><pre></pre></details>
  </section>
</template>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/exceljs.min.js"></script>
<script src="core.js?v=e0b730a"></script>
<script>
(function () {
  var CFG = {
    excel: { ext: ['.xlsx', '.xlsm'], run: '합치기', out: 'xlsx', name: '취합결과', accept: '.xlsx,.xlsm',
      hint: '첫 번째 파일의 서식을 기준으로 합칩니다. 헤더와 성명 열은 자동으로 찾고, 시트가 여러 개면 같은 순서의 시트끼리 합칩니다.',
      drop: '엑셀 파일(.xlsx)을 끌어다 놓으세요' },
    hwpx: { ext: ['.hwpx'], run: '이어붙이기', out: 'hwpx', name: '병합결과', accept: '.hwpx',
      hint: '목록 순서대로 뒤에 이어붙입니다. 파일마다 원본 서식이 유지됩니다. .hwp는 한글에서 HWPX로 저장한 뒤 사용하세요.',
      drop: '한글 파일(.hwpx)을 끌어다 놓으세요' }
  };
  var S = {}, P = {};
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var size = function (n) { return n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; };
  function stamp() { var d = new Date(), p = function (x) { return ('0' + x).slice(-2); }; return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()); }
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }

  Object.keys(CFG).forEach(function (k) {
    var n = document.getElementById('tpl').content.firstElementChild.cloneNode(true);
    n.id = 'panel-' + k; n.setAttribute('aria-labelledby', 'tab-' + k);
    n.querySelector('.hint').textContent = CFG[k].hint;
    n.querySelector('.drop p').textContent = CFG[k].drop;
    n.querySelector('[data-a=run]').textContent = CFG[k].run;
    n.querySelector('input').accept = CFG[k].accept;
    document.getElementById('panels').appendChild(n);
    P[k] = n; S[k] = { files: [], busy: false, drag: null };
    wire(k); draw(k);
  });

  function tab(k) {
    document.body.dataset.theme = k;
    Object.keys(P).forEach(function (j) {
      P[j].hidden = j !== k;
      document.getElementById('tab-' + j).setAttribute('aria-selected', j === k);
      document.getElementById('tab-' + j).tabIndex = j === k ? 0 : -1;
    });
  }
  Object.keys(CFG).forEach(function (k) { document.getElementById('tab-' + k).onclick = function () { tab(k); }; });
  tab('excel');
  document.querySelector('.seg').addEventListener('keydown', function(e) { if (['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key) === -1) return; e.preventDefault(); var k = e.key === 'Home' ? 'excel' : e.key === 'End' ? 'hwpx' : document.getElementById('tab-excel').getAttribute('aria-selected') === 'true' ? 'hwpx' : 'excel'; tab(k); document.getElementById('tab-' + k).focus(); });

  function add(k, list) {
    if (S[k].busy) return; res(k); status(k, "");
    var skip = 0;
    Array.prototype.forEach.call(list, function (f) {
      var ok = CFG[k].ext.some(function (x) { return f.name.toLowerCase().slice(-x.length) === x; });
      if (!ok) { skip++; return; }
      if (!S[k].files.some(function (g) { return g.name === f.name && g.size === f.size; })) S[k].files.push(f);
    });
    draw(k);
    if (skip) status(k, skip + '개 파일은 형식이 달라 제외했습니다.', 'err');
  }
  function status(k, t, c) { var s = P[k].querySelector('.st'); s.textContent = t || ''; s.className = 'st ' + (c || ''); }
  function res(k) { P[k].querySelector('.res').hidden = true; }

  function draw(k) {
    var st = S[k], ol = P[k].querySelector('ol');
    P[k].classList.toggle('busy', st.busy); P[k].setAttribute('aria-busy', st.busy);
    P[k].querySelector('[data-a=pick]').disabled = st.busy;
    var count = P[k].querySelector('.count'); count.hidden = !st.files.length; count.textContent = st.files.length + '개 파일 · ' + size(st.files.reduce(function(n,f){ return n + f.size; },0));
    P[k].querySelector('[data-a=run]').textContent = st.busy ? '문서를 하나로 모으는 중…' : CFG[k].run + ' →';
    ol.textContent = '';
    st.files.forEach(function (f, i) {
      var li = el('li'); li.style.setProperty('--i', Math.min(i, 8));
      li.draggable = !st.busy;
      li.appendChild(el('span', 'n', i + 1));
      var nm = el('span', 'nm', f.name); nm.title = f.name; li.appendChild(nm);
      if (i === 0 && k === 'excel') li.appendChild(el('span', 'base', '서식 기준'));
      li.appendChild(el('span', 'sz', size(f.size)));
      [['↑', -1, '위로'], ['↓', 1, '아래로'], ['✕', 0, '제거']].forEach(function (d) {
        var b = el('button', 'ic', d[0]); b.setAttribute('aria-label', f.name + ' ' + d[2]);
        b.disabled = st.busy || (d[1] === -1 && i === 0) || (d[1] === 1 && i === st.files.length - 1);
        b.onclick = function () {
          if (!d[1]) st.files.splice(i, 1); else { var m = st.files.splice(i, 1)[0]; st.files.splice(i + d[1], 0, m); }
          res(k); status(k, ''); draw(k);
        };
        li.appendChild(b);
      });
      li.ondragstart = function (e) { st.drag = i; try { e.dataTransfer.setData('text/plain', i); } catch (x) {} };
      li.ondragover = function (e) { if (st.drag !== null) { e.preventDefault(); li.classList.add('over'); } };
      li.ondragleave = function () { li.classList.remove('over'); };
      li.ondrop = function (e) {
        if (st.busy || st.drag === null) return; e.preventDefault(); e.stopPropagation(); res(k); status(k, '');
        var m = st.files.splice(st.drag, 1)[0]; st.files.splice(i, 0, m); st.drag = null; draw(k);
      };
      li.ondragend = function () { st.drag = null; li.classList.remove('over'); };
      ol.appendChild(li);
    });
    P[k].querySelector('.empty').hidden = st.files.length >= 2;
    P[k].querySelector('[data-a=run]').disabled = st.busy || st.files.length < 2;
  }

  function wire(k) {
    var p = P[k], inp = p.querySelector('input'), drop = p.querySelector('.drop');
    p.querySelector('[data-a=pick]').onclick = function () { inp.click(); };
    inp.onchange = function () { add(k, inp.files); inp.value = ''; res(k); };
    drop.ondragover = function (e) { if (S[k].drag === null) { e.preventDefault(); drop.classList.add('drag'); } };
    drop.ondragleave = function () { drop.classList.remove('drag'); };
    drop.ondrop = function (e) { e.preventDefault(); drop.classList.remove('drag'); add(k, e.dataTransfer.files); res(k); };
    p.querySelector('[data-a=run]').onclick = function () { run(k); };
  }

  async function run(k) {
    if (S[k].busy || S[k].files.length < 2) return;
    var st = S[k], p = P[k], bar = p.querySelector('.bar'), fill = bar.firstElementChild, pre = p.querySelector('pre');
    st.busy = true; draw(k); res(k); pre.textContent = '';
    bar.classList.add('on'); fill.style.width = '0%'; bar.setAttribute('aria-valuenow','0'); status(k, '파일을 읽고 있습니다…');
    var total = st.files.length;
    try {
      var items = [];
      for (var i = 0; i < total; i++) items.push({ name: st.files[i].name, data: await st.files[i].arrayBuffer() });
      var fn = k === 'excel' ? Merge.mergeExcel : Merge.mergeHwpx;
      var out = await fn(items, {
        log: function (m) { pre.textContent += m + '\n'; },
        progress: function (d, t) { var percent = Math.round(d / t * 100); fill.style.width = percent + '%'; bar.setAttribute('aria-valuenow',percent); status(k, d + ' / ' + t + ' 파일 처리 · ' + percent + '%'); return sleep(80); }
      });
      fill.style.width = '100%'; bar.setAttribute('aria-valuenow','100'); status(k, '수합이 완료되었습니다.', 'ok');
      done(k, out);
    } catch (e) {
      status(k, (e && e.message) || '문제가 생겼습니다.', 'err');
    }
    st.busy = false; draw(k);
  }

  function done(k, out) {
    var r = P[k].querySelector('.res'); r.textContent = ''; r.hidden = false;
    r.appendChild(el('div','success-icon','✓')); r.appendChild(el('h3',null,'하나로 모았어요.'));
    celebrate();
    var n = k === 'excel' ? '시트 ' + out.sheets + '개 · 항목 ' + out.rows + '개' : '구역 ' + out.sections + '개';
    r.appendChild(el('p', null, n + ' · ' + size(out.data.length)));
    var b = el('button', 'b', '결과 파일 다운로드 ↓'); r.appendChild(b);
    b.onclick = function () {
      var blob = new Blob([out.data], { type: 'application/octet-stream' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = CFG[k].name + '_' + stamp() + '.' + CFG[k].out;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 15000);
    };
    if (out.warnings && out.warnings.length) {
      var ul = el('ul', 'warn'); out.warnings.forEach(function (w) { ul.appendChild(el('li', null, w)); }); r.appendChild(ul);
    }
  }
function celebrate() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var colors=document.body.dataset.theme === 'hwpx' ? ['#0f6cbd','#70b2ee','#b5d7f5','#8ccde3'] : ['#107c41','#64bd8a','#a5d9ba','#d2e9ac'];
    for(var i=0;i<36;i++){var c=el('i','confetti');c.setAttribute('aria-hidden','true'); c.style.left=(15+Math.random()*70)+'vw'; c.style.setProperty('--c',colors[i%4]);c.style.setProperty('--d',(1.4+Math.random()*1.5)+'s');c.style.setProperty('--x',(-100+Math.random()*200)+'px');c.style.setProperty('--r',(Math.random()*720)+'deg');document.body.appendChild(c);setTimeout(function(node){node.remove();},3200,c);}
  }
})();
</script>
</body>
</html>
